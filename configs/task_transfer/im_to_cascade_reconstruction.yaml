# Stage E -- frozen forward-dynamics reuse, NOT action-conditioned transfer.
#
# registry.task_families classifies this FORWARD_DYNAMICS because
# cascade_reconstruction's generator injects no mid-cascade interventions
# (gen_action_ops is empty). The frozen model is called as a forward oracle; its
# action-conditioning is never exercised, so the Layer-2 action metrics are
# NOT_APPLICABLE here rather than zero.

experiment_name: e_im_to_cascade_reconstruction
source_task: influence_maximization
target_task: cascade_reconstruction
transfer_level: FORWARD_DYNAMICS

source_checkpoint: results/influence_maximization/ba/default/world_model/wm_sage_IC.pt
freeze_world_model: true
target_finetuning: false
required_semantic_overrides: 0

reused_components: [graph_backbone, edge_propensity, T_endo, T_exo_semantics]
reinitialized_components: [readout, search_procedure]

graph_split: graph_disjoint
dynamics: [IC, LT]
seeds: [0, 1, 2, 3, 4]

evaluation:
  prediction: [ens_marg_mae, ens_count_bias]
  action_fidelity: NOT_APPLICABLE
  task_utility: TASK_SPECIFIC
  transfer: [transfer_gap, oracle_gap, decision_retention]

status: NOT_RUN
blocker: >
  cascade_reconstruction has no runnable data/model path in this repository yet; its
  head and task module live on the 8-task branch and have not been ported.
