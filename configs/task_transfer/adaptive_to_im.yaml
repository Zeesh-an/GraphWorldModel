# T1 / Stage D1 -- THE primary cross-task generalization experiment.
#
# A world model trained on influence maximization, frozen, used directly as the
# evaluator for adaptive online IM. The two tasks are classified
# EXACT_CHECKPOINT by registry.task_families, and that classification is derived:
# same world family (W1, 6/2 channels), same dynamics (IC, LT), same
# remove_semantics (spent), and adaptive IM's action vocabulary is covered by
# IM's. Nothing is rebuilt.
#
# The falsifiable part: `required_semantic_overrides: 0`. If loading the
# checkpoint for the target needs ANY spec override, this stops being clean
# EXACT_CHECKPOINT transfer and must be reported as such rather than quietly
# overridden -- world_model.checkpoint.load_checkpoint refuses a disagreeing
# spec by default, so an override cannot happen silently.

experiment_name: t2_adaptive_to_im
source_task: adaptive_online_im
target_task: influence_maximization
transfer_level: EXACT_CHECKPOINT

source_checkpoint: results/adaptive_online_im/ba/default/world_model/wm_sage_IC.pt
freeze_world_model: true
target_finetuning: false
required_semantic_overrides: 0

reused_components: [graph_backbone, edge_propensity, T_endo, T_exo_semantics,
                    prediction_head]
reinitialized_components: []

graph_split: graph_disjoint
# Target graphs must not have trained the source checkpoint. Enforced, not
# assumed: the runner asserts train overlap is zero.
target_graphs: {dataset: ba, syn_nodes: 100, num_graphs: 10, held_out: true}
dynamics: [IC, LT]
seeds: [0, 1, 2, 3, 4]

# Arms to compare against, in increasing order of what they'd prove.
arms:
  - evolve_free@oracle          # fidelity ceiling
  - evolve_free@world_model     # ours: the frozen IM checkpoint
  - evolve_free@monte_carlo     # cost axis
  - evolve_free@native          # no forward model at all

evaluation:
  prediction: [delta_f1, ens_marg_mae, ens_count_bias]
  action_fidelity: [effect_mae_norm, effect_sign_agree, shuffle_delta_f1_drop,
                    exogenous_fidelity]
  task_utility: [spread, planning_regret, budget_regret, adaptivity_gap,
                 pairwise_preference_accuracy, trusted_call_reduction,
                 precision_at_k, calls_to_first_win]
  transfer: [transfer_gap, oracle_gap, decision_retention]
