# G1.4 synthetic -> real. Train on synthetic families only; every real graph is a
# HELD-OUT TRANSFER SET.
#
# This is the decided policy for single real graphs (they admit no graph-disjoint
# split, so splitting one episode-randomly would produce an in-graph number
# dressed as a test number). Here they never enter training at all, which makes
# the question well-posed instead of unanswerable.
experiment_name: g1_4_synthetic_to_real

train:
  task: influence_maximization
  dataset: [ba, er, ws, sbm]
  syn_nodes: 100
  num_graphs: 10          # per family
  dynamics: [IC, LT]
  split_mode: graph_disjoint

test:
  - {dataset: jazz}
  - {dataset: netscience}
  - {dataset: power_grid}
  - {dataset: nethept}

world_model: {backbone: sage, head: structured, hidden_dim: 64, num_layers: 3,
              remove_semantics: spent, hide_edge_weights: false}
seeds: [0, 1, 2, 3, 4]
freeze_world_model: true
target_finetuning: false
