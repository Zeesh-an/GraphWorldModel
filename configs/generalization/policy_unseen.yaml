# G2 policy generalization. The world model is trained on trajectories harvested
# from a handful of behaviour policies; the coding agent emits far more.
#
# The measured gap today: 6 of 36 influence-maximization algorithms the agent can
# emit appear in the training trajectories. registry.consistency reports it as
# the `spine_coverage` warning on every run, and this config turns it into an
# experiment instead of a caveat.
experiment_name: g2_policy_generalization

train:
  task: influence_maximization
  dataset: ba
  syn_nodes: 100
  num_graphs: 20
  dynamics: [IC, LT]
  split_mode: graph_disjoint

# The six spine selectors, under their coding-agent names (registry.core
# .wm_spine_aliases relates the two vocabularies).
seen_policies: [random_seeds, high_degree, pagerank_seeds, betweenness_seeds,
                celf, hill_climbing]

# Never used to harvest a training trajectory. Chosen to span mechanisms rather
# than to be numerous: sketch/RIS, community-structured, and metaheuristic.
unseen_policies: [degree_discount, celf_pp, imm, ris_basic, community_im,
                  voterank, collective_influence, simulated_annealing]

metrics: [forward_outcome_fidelity, pairwise_preference_accuracy,
          spearman, kendall_tau, top_k_recall, planning_regret, decision_value]
seeds: [0, 1, 2, 3, 4]
freeze_world_model: true
target_finetuning: false
